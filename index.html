<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            min-height: 100vh;
        }

        .navbar {
            background: linear-gradient(90deg, #141e30, #243b55);
        }

        .card {
            border: none;
            border-radius: 20px;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .card:hover {
            transform: translateY(-8px);
        }

        .card-title {
            font-weight: bold;
        }

        .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .welcome {
            font-weight: bold;
            color: #fff;
        }

        .glass {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
        }

        .count {
            font-size: 40px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark px-3">
    <a class="navbar-brand fw-bold"> Student Admin Dashboard</a>
    <a href="login.html" class="btn btn-danger btn-sm">Logout</a>
</nav>

<!-- CONTAINER -->
<div class="container mt-5">

    <div class="glass mb-4 text-center">
        <h2 class="welcome">Welcome Admin </h2>
        <p class="text-white">Manage students efficiently</p>
    </div>

    <div class="row g-4">

        <!-- TOTAL STUDENTS -->
        <div class="col-md-4">
            <div class="card p-4 text-center bg-primary text-white">
                <i class="fa fa-users icon"></i>
                <h4>Total Students</h4>
                <div id="studentCount" class="count">Loading...</div>
            </div>
        </div>

        <!-- ADD STUDENT -->
        <div class="col-md-4">
            <div class="card p-4 text-center bg-success text-white">
                <i class="fa fa-user-plus icon"></i>
                <h4>Add Student</h4>
                <a href="addStudent.html" class="btn btn-light mt-2">Add</a>
            </div>
        </div>

        <!-- VIEW STUDENTS -->
        <div class="col-md-4">
            <div class="card p-4 text-center bg-dark text-white">
                <i class="fa fa-list icon"></i>
                <h4>Student List</h4>
                <a href="viewStudents" class="btn btn-light mt-2">View</a>
            </div>
        </div>

    </div>
</div>

<!-- SCRIPT -->
<script>
fetch("totalStudents")
    .then(res => res.text())
    .then(data => {
        document.getElementById("studentCount").innerText = data;
    })
    .catch(() => {
        document.getElementById("studentCount").innerText = "Error";
    });
</script>

</body>
</html>
