<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            min-height: 100vh;
        }

        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .title {
            font-weight: bold;
            color: #198754;
        }

        .icon {
            font-size: 40px;
            color: #198754;
        }

        .form-control {
            border-radius: 10px;
        }

        .btn {
            border-radius: 10px;
        }

        .top-header {
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="top-header text-white">
        <i class="fa-solid fa-user-plus icon"></i>
        <h2 class="mt-2">Add New Student</h2>
        <p>Fill in the details below</p>
    </div>

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card p-4 bg-white">

                <form action="addStudent" method="post">

                    <!-- NAME -->
                    <div class="mb-3">
                        <label class="form-label">
                            <i class="fa fa-user"></i> Name
                        </label>
                        <input type="text" name="name" class="form-control" placeholder="Enter student name" required>
                    </div>

                    <!-- AGE -->
                    <div class="mb-3">
                        <label class="form-label">
                            <i class="fa fa-calendar"></i> Age
                        </label>
                        <input type="number" name="age" class="form-control" placeholder="Enter age" required>
                    </div>

                    <!-- COURSE -->
                    <div class="mb-3">
                        <label class="form-label">
                            <i class="fa fa-book"></i> Course
                        </label>
                        <input type="text" name="course" class="form-control" placeholder="Enter course name" required>
                    </div>

                    <!-- BUTTON -->
                    <button type="submit" class="btn btn-success w-100">
                        <i class="fa fa-plus"></i> Add Student
                    </button>

                </form>

                <!-- BACK BUTTON -->
                <a href="index.html" class="btn btn-secondary w-100 mt-3">
                    <i class="fa fa-home"></i> Back Home
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
